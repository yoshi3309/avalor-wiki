# Pages CMS: https://app.pagescms.org
# Only the public content collection is editable. Keeper material must live elsewhere.
media:
  input: assets/uploads
  output: /assets/uploads
content:
  - name: articles
    label: Public archive articles
    type: collection
    path: content/articles
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, era, featured]
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: summary
        label: Short summary
        type: text
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: ["Kingdoms & Places", "People & Legends", "Organizations & Factions", "History & Chronicles", "Faith, Magic & Cosmology"]
      - name: image
        label: Main image / character portrait
        type: image
        description: "Upload a public image for this article. Portraits, locations, and artifacts all work."
        options:
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
      - name: image_alt
        label: Image description (accessibility)
        type: string
        description: "Describe what is pictured, e.g. Lavitz Shawe in ceremonial armor."
      - name: image_caption
        label: Image caption or artist credit
        type: string
      - name: entry
        label: Archive number
        type: string
      - name: era
        label: Historical period
        type: string
      - name: facts
        label: "At a glance (one Label: Value per line)"
        type: text
      - name: related
        label: Related article filenames (comma separated)
        type: string
      - name: source
        label: Source volume / chapter
        type: string
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: body
        label: The Scholar's Account (PLAYER-VISIBLE)
        type: rich-text
        required: true
  - name: atlas
    label: Map settings & locations
    type: file
    path: data/avalor-map.yml
    format: yaml
    fields:
      - name: title
        label: Map title
        type: string
      - name: image
        label: Map illustration (upload your new Avalor map here)
        type: image
        description: "Public artwork only. Upload your Avalor map PNG/JPG/WebP here, then Save."
        options:
          categories: [image]
          extensions: [png, jpg, jpeg, webp]
          rename: safe
      - name: image_alt
        label: Map description
        type: text
      - name: image_credit
        label: Image credit
        type: string
      - name: locations
        label: Map locations and markers
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: id
            label: Unique location key (keep unchanged)
            type: string
            required: true
          - name: name
            label: Display name
            type: string
            required: true
          - name: type
            label: Marker category
            type: select
            options:
              values: [settlement, region, water, historic, institution]
          - name: x
            label: Horizontal position (0–100%; blank = not yet placed)
            type: number
            description: "Use the atlas's Position pins tool to measure exact coordinates."
          - name: y
            label: Vertical position (0–100%; blank = not yet placed)
            type: number
          - name: description
            label: Player-facing summary
            type: text
          - name: article
            label: Linked article filename (without .md)
            type: string
            description: "Example: renada, heavens-heart, heroes-hill. Leave empty for no link."
          - name: related_places
            label: Inside this location (comma-separated article filenames, no separate pins)
            type: string
            description: "Example for Renada: great-citadel,great-cathedral. Those articles appear in the city detail panel, not as overlapping map markers."
          - name: published
            label: Show marker to players (enable after positioning)
            type: boolean
          - name: provisional
            label: Mark position as provisional
            type: boolean
