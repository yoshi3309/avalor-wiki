id: "elven-concord"
title: "The Elven Concord"
subtitle: "Recognition and the rights of an inhabited forest"
kind: "Accord & settlement"
period: "Dietmar’s reign · 107–155 AF"
period_group: "Founding Age"
symbol: "❦"
summary: "The woodland settlement that acknowledged the Frozenroar crown while protecting the customary rights and forms of governance of elven communities."
folio_title: "The Crown and the Ancient Wood"
folio_text: |-
  During Dietmar Frozenroar’s reign, disputes over roads, settlement, taxation, and authority escalated into conflict with elven communities of the Forest of the Fey.
  The Elven Concord recognized the monarchy and preserved established woodland rights and elements of clan government.
  The later marriage of Halton Frozenroar and Dathyra Blueshadow strengthened the political peace. Their son Sylavor inherited the throne.
evidence: |-
  The forest's elven settlements and ancestral rights predated Avalor.
  The Concord settled conflict during Dietmar’s reign and preserved significant customary rights.
  Halton was Dietmar’s acknowledged heir, while Halton and Dathyra were Sylavor’s parents.
  Some communities continue to observe a Concord Walk to revisit agreed boundaries and responsibilities.
uncertainty: |-
  No authenticated article-by-article text of the Concord is presented by the public scholarship.
  The Royal Register does not specify the precise kinship between Dietmar and Halton.
  The Concord Walk is a tradition in some communities, not a uniform practice or a substitute for law.
interpretation: |-
  Royal memory often describes rights granted by the crown; woodland memory remembers older rights finally acknowledged. Both perspectives are essential to understanding the settlement.
source_article: "forest-of-the-fey"
